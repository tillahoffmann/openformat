[project]
name = "openformat"
version = "0.3.0"
description = "Tools for loading binary data from scientific equipment."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Till Hoffmann"},
    {name = "Mary Burkitt-Gray"},
]
dependencies = [
    "numpy>=1.3",
    "scipy>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "sphinx>=7.0.0",
]
